<!DOCTYPE html>
<html>
    <head>
        <title>Content Blocked</title>
        <style>
            body {
                font-family: Arial, sans-serif;
                background-color: black;
                color: white;
                display: flex;
                flex-direction: column;
                justify-content: center;
                align-items: center;
                height: 100vh;
                margin: 0;
                padding: 0;
            }
            h1 {
                font-size: 24px;
                margin-bottom: 10px;
            }
            p {
                font-size: 16px;
                margin-bottom: 20px;
            }
            button {
                padding: 10px 20px;
                background-color: #ff0000;
                color: white;
                border: none;
                border-radius: 5px;
                cursor: pointer;
                font-size: 16px;
            }
        </style>
    </head>
    <body>
        <h1>This video has been blocked</h1>
        <p id="reason">Reason: Not educational content</p>
        <button id="override">Override and Continue</button>
    </body>
</html>
