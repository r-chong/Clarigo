<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Clarigo Options</title>
  <style>
    :root {
      --bg: #fafbfc;
      --surface: #ffffff;
      --text: #1a1d21;
      --text-muted: #5c6269;
      --accent: #0d6b4c;
      --accent-hover: #0a5840;
      --border: #e4e7eb;
      --radius: 12px;
      --danger: #b42318;
    }

    * { box-sizing: border-box; }

    body {
      max-width: 560px;
      margin: 0 auto;
      padding: 32px 20px 48px;
      font-family: system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
      font-size: 14px;
      color: var(--text);
      background: var(--bg);
      line-height: 1.45;
    }

    h1 {
      margin: 0 0 6px;
      font-size: 22px;
      letter-spacing: -0.02em;
    }

    .lead {
      margin: 0 0 24px;
      color: var(--text-muted);
    }

    .card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 16px;
      margin-bottom: 16px;
    }

    .card h2 {
      margin: 0 0 8px;
      font-size: 15px;
    }

    .card p {
      margin: 0 0 14px;
      color: var(--text-muted);
      font-size: 13px;
    }

    .field-row {
      display: flex;
      gap: 8px;
    }

    input[type="text"] {
      flex: 1;
      min-width: 0;
      padding: 10px 12px;
      border: 1px solid var(--border);
      border-radius: 8px;
      font: inherit;
    }

    input[type="text"]:focus {
      outline: 2px solid rgba(13, 107, 76, 0.25);
      border-color: var(--accent);
    }

    .btn {
      border: none;
      border-radius: 8px;
      padding: 10px 14px;
      font: inherit;
      font-weight: 600;
      cursor: pointer;
      background: var(--accent);
      color: #fff;
    }

    .btn:hover { background: var(--accent-hover); }

    .error {
      margin: 10px 0 0;
      color: var(--danger);
      font-size: 13px;
    }

    .whitelist-list {
      list-style: none;
      margin: 0;
      padding: 0;
    }

    .whitelist-item {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      padding: 10px 0;
      border-top: 1px solid var(--border);
    }

    .whitelist-item:first-child { border-top: none; padding-top: 0; }

    .whitelist-item-copy {
      display: flex;
      flex-direction: column;
      gap: 2px;
      min-width: 0;
    }

    .whitelist-item-label {
      font-weight: 600;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .whitelist-item-meta {
      font-size: 12px;
      color: var(--text-muted);
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .btn-remove {
      flex-shrink: 0;
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 6px 10px;
      font: inherit;
      font-size: 12px;
      background: #fff;
      color: var(--text-muted);
      cursor: pointer;
    }

    .btn-remove:hover {
      color: var(--danger);
      border-color: rgba(180, 35, 24, 0.35);
    }

    .empty {
      margin: 0;
      color: var(--text-muted);
      font-size: 13px;
    }
  </style>
</head>
<body>
  <h1>Clarigo settings</h1>
  <p class="lead">Videos from whitelisted channels are never hidden, even if the model thinks they are non-educational.</p>

  <div class="card">
    <h2>Channel whitelist</h2>
    <p>Add a channel by @handle, URL, or display name (e.g. <code>@kurzgesagt</code>, <code>kurzgesagt</code>, or <code>Crash Course</code>).</p>

    <form id="whitelist-form">
      <div class="field-row">
        <input
          id="channel-input"
          type="text"
          placeholder="@channel or youtube.com/@channel"
          autocomplete="off"
          spellcheck="false"
        >
        <button type="submit" class="btn">Add</button>
      </div>
      <p id="whitelist-error" class="error" hidden></p>
    </form>
  </div>

  <div class="card">
    <h2>Whitelisted channels</h2>
    <p id="whitelist-empty" class="empty">No channels whitelisted yet.</p>
    <ul id="whitelist-list" class="whitelist-list"></ul>
  </div>

  <script src="whitelist.js"></script>
  <script src="options.js"></script>
</body>
</html>
